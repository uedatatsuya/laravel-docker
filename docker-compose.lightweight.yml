services:
  app:
    image: laravel-docker-lightweight-app
    build:
      context: .
      dockerfile: ./infra/docker/php/Dockerfile.lightweight
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "${WEB_PUBLISHED_PORT:-8080}:8000"
    volumes:
      - ./src:/workspace
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${WEB_PUBLISHED_PORT:-8080}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /workspace/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
